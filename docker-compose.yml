services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${CINEJELLY_IMAGE:-cinejelly-seedance-ultimate-director:local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "8787"
      CINEJELLY_OUTPUT_DIR: /app/assets/output_deliverables
      CINEJELLY_TRUST_PROXY_HEADERS: "true"
    volumes:
      - cinejelly-output:/app/assets/output_deliverables
      - cinejelly-reference-inputs:/app/assets/reference_inputs
    expose:
      - "8787"
    # Giới hạn log để chạy nhiều tuần không đầy ổ (durability-audit F6): mặc định Docker giữ log
    # json-file KHÔNG giới hạn.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      CINEJELLY_PUBLIC_HOST: ${CINEJELLY_PUBLIC_HOST:?Set CINEJELLY_PUBLIC_HOST to the HTTPS hostname, for example api.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cinejelly-output:
  cinejelly-reference-inputs:
  caddy-data:
  caddy-config:
